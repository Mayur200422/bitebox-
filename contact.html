    <h2>Customer Registration & Order Form</h2>

    <form action="">
        <h3>Customer Information</h3>
        <label for="Fullname">Full Name </label> <br> <input type="text" id="fullname" name="fullname"> <br> <br>
        <label for="email">Email Address</label> <br> <input type="email" id="email" name="email"> <br> <br>
        <label for="Password">Password</label> <br> <input type="password" id="password" name="password"> <br> <br>
        <label for="Phone Number">Phone.No</label> <br> <input type="number" id="phone" name="phone"> <br> <br>

        <h3>Order Information</h3>
        <label for="Quantity">Quantity</label> <br> <input type="number" id="Quantity" name="Quantity"> <br> <br>
        <label for="deliverydate">Preferred Delivery Date</label> <br> <input type="date" id="deliverydate" name="deliverydate"> <br>
        <br>


        <label for="Food">Select Food Item</label> <br> <select name="Food" id="Food">
            <option value="">Cheesy Veg Pizza</option>
            <option value="">White Souce Pasta</option>
            <option value="">Classic Cheese Burger</option>
            <option value="">Sandwich</option>
            <option value="">French Fries</option>
        </select>

        <h3> Payment Method</h3>

        <input type="radio" id="cash" name="payment">
        <label for="cash">Cash</label>
        <br>
        <input type="radio" id="card" name="payment">
        <label for="card">Card</label>
        <br>
        <input type="radio" id="upi" name="payment">
        <label for="upi">UIP</label>
        <br>

        <h3>Extras</h3>

        <input type="checkbox" id="cheese" name="extra">
        <label for="cheese">cheese</label>
        <br>
            <input type="checkbox" id="drink" name="extra">
        <label for="drink">drink</label>
        <br>
            <input type="checkbox" id="dessert" name="extra">
        <label for="dessert">dessert</label>

        <h3>Delivery Instruction</h3>
        <label for="address">Delivery  Address</label> <br>
        <textarea name="address" id="address" rows="5" cols="40"></textarea>
        <br>
        <br>
        <input type="submit" value="place Order">
        <input type="reset" value="Clear Form">
        

    </form>
</body>
</html>
